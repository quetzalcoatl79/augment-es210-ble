# Copie ce fichier en "config.ini" et remplis-le avec TES valeurs.
# config.ini est ignoré par git (il contient des infos propres à ta trottinette).

[scooter]
# Adresse BLE de TA trottinette (voir README : scan BLE / bluetoothctl / nRF Connect)
mac = AA:BB:CC:DD:EE:FF

# Jetons PROPRES À TA TROTTINETTE, à CAPTURER depuis ta propre appli Augment
# (voir README, section « Capturer tes jetons »). Chaîne hexa, sans espaces.
# Ne PAS réutiliser les jetons de quelqu'un d'autre : ils sont par appareil.
unlock =
lock   =

# Registre de config 6881 (généralement commun aux ES210 / firmware ECA).
# speed35  = débridage (~35 km/h) : octet haut 0x50
# normal25 = re-bridage 25 km/h  : mode 3 normal (octet haut 0x4c)
speed35  = be50
normal25 = de4c
